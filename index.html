    <style>
        /* Custom Styles & Animations */
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Prevent scrolling on the body */
            user-select: none; /* Feel more like an app */
        }

        /* Desktop Background */
        #desktop {
            /* Updated to Itachi Uchiha Moon Background */
            background: url('download.jpg') no-repeat center center/cover;
            height: 100vh;
            width: 100vw;
            position: relative;
            overflow: hidden;
        }

        /* Glassmorphism Utilities */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .glass-dark {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }

        /* Desktop Icons */
        .desktop-icon {
            transition: all 0.2s;
            cursor: pointer;
            width: 80px;
        }
        .desktop-icon:hover {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
        }
        .desktop-icon:active {
            transform: scale(0.95);
        }

        /* Windows */
        .window {
            position: absolute;
            background: #f8fafc;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 300px;
            min-height: 200px;
            transition: opacity 0.2s, transform 0.2s;
            resize: both; /* Allow resizing */
        }
        
        .window.maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: calc(100% - 48px) !important; /* Subtract taskbar height */
            border-radius: 0;
            resize: none;
        }

        .window-header {
            cursor: grab;
            user-select: none;
        }
        .window-header:active {
            cursor: grabbing;
        }

        /* Terminal Specifics */
        .terminal-body {
            font-family: 'JetBrains Mono', monospace;
            overflow-y: auto;
        }
        .blink {
            animation: blinker 1s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }

        /* Taskbar */
        #taskbar {
            z-index: 9999;
        }
        .taskbar-item {
            transition: all 0.2s;
        }
        .taskbar-item:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .taskbar-item.active {
            background: rgba(255, 255, 255, 0.3);
            border-bottom: 3px solid #3b82f6;
        }

        /* Start Menu */
        #start-menu {
            bottom: 60px;
            left: 10px;
            transition: transform 0.2s ease-in-out, opacity 0.2s;
            transform-origin: bottom left;
        }
        #start-menu.hidden {
            display: none; /* Fallback */
        }
        #start-menu.closed {
            transform: scale(0.95) translateY(20px);
            opacity: 0;
            pointer-events: none;
        }

        /* Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Boot Screen */
        #boot-screen {
            z-index: 10000;
        }
    </style>

    <script>
        // --- System State ---
        let highestZIndex = 100;
        let windows = {}; // Store window instances
        
        // --- Boot Sequence ---
        const bootText = [
            "Initializing BIOS...",
            "Checking Memory... 32GB OK",
            "Loading CPU Microcode...",
            "Detecting Primary Master... SSD 1TB",
            "Booting DevOS v1.0...",
            "Mounting File System...",
            "Starting Graphical Interface...",
            "Welcome, User."
        ];

        async function runBootSequence() {
            const screen = document.getElementById('boot-text');
            for (let line of bootText) {
                const p = document.createElement('div');
                p.textContent = `> ${line}`;
                screen.appendChild(p);
                await new Promise(r => setTimeout(r, 400));
            }
            await new Promise(r => setTimeout(r, 800));
            document.getElementById('boot-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('boot-screen').remove();
                document.getElementById('desktop').classList.remove('hidden');
                // Auto open 'About'
                openWindow('about');
            }, 500);
        }

        // --- Window Manager ---
        function openWindow(appId) {
            // If already open, just bring to front
            if (windows[appId]) {
                focusWindow(appId);
                if (windows[appId].element.style.display === 'none') {
                     windows[appId].element.style.display = 'flex';
                     updateTaskbar(appId, true);
                }
                return;
            }

            const container = document.getElementById('windows-container');
            const template = document.getElementById(`tpl-${appId}`);
            
            if (!template) return;

            // Create Window Element
            const win = document.createElement('div');
            win.className = 'window glass pointer-events-auto flex flex-col';
            win.id = `win-${appId}`;
            
            // Dimensions
            const width = appId === 'terminal' ? 600 : 800;
            const height = appId === 'terminal' ? 400 : 500;
            win.style.width = `${width}px`;
            win.style.height = `${height}px`;

            // Positioning
            if (appId === 'about') {
                // Center the 'About' window specifically
                const left = (window.innerWidth - width) / 2;
                const top = (window.innerHeight - height) / 2;
                win.style.left = `${Math.max(0, left)}px`;
                win.style.top = `${Math.max(0, top)}px`;
            } else {
                // Cascade other windows
                win.style.left = `${50 + (Object.keys(windows).length * 30)}px`;
                win.style.top = `${50 + (Object.keys(windows).length * 30)}px`;
            }
            
            win.style.zIndex = ++highestZIndex;

            // Header
            const title = appId.charAt(0).toUpperCase() + appId.slice(1);
            const iconClass = getIconForApp(appId);
            
            win.innerHTML = `
                <div class="window-header h-10 bg-gray-100/90 border-b border-gray-200 flex items-center justify-between px-3 rounded-t-lg" onmousedown="startDrag(event, '${appId}')">
                    <div class="flex items-center gap-2 text-sm text-gray-600 font-medium">
                        <i class="${iconClass}"></i> ${title}
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="minimizeWindow('${appId}')" class="w-3 h-3 rounded-full bg-yellow-400 hover:bg-yellow-500"></button>
                        <button onclick="maximizeWindow('${appId}')" class="w-3 h-3 rounded-full bg-green-500 hover:bg-green-600"></button>
                        <button onclick="closeWindow('${appId}')" class="w-3 h-3 rounded-full bg-red-500 hover:bg-red-600"></button>
                    </div>
                </div>
                <div class="flex-1 overflow-hidden relative bg-white rounded-b-lg">
                    ${template.innerHTML}
                </div>
            `;

            // Append
            container.appendChild(win);
            
            // Register
            windows[appId] = {
                element: win,
                maximized: false,
                prevStyle: {}
            };

            // Setup Terminal Logic if needed
            if (appId === 'terminal') {
                setupTerminal();
            }

            // Taskbar Item
            addToTaskbar(appId);
            
            // Focus
            win.addEventListener('mousedown', () => focusWindow(appId));
        }

        function closeWindow(appId) {
            const win = windows[appId];
            if (win) {
                win.element.remove();
                delete windows[appId];
                removeFromTaskbar(appId);
            }
        }

        function minimizeWindow(appId) {
            const win = windows[appId];
            if (win) {
                win.element.style.display = 'none';
                updateTaskbar(appId, false);
            }
        }

        function maximizeWindow(appId) {
            const winObj = windows[appId];
            const win = winObj.element;
            
            if (!winObj.maximized) {
                // Save state
                winObj.prevStyle = {
                    top: win.style.top,
                    left: win.style.left,
                    width: win.style.width,
                    height: win.style.height
                };
                win.classList.add('maximized');
                winObj.maximized = true;
            } else {
                // Restore
                win.classList.remove('maximized');
                win.style.top = winObj.prevStyle.top;
                win.style.left = winObj.prevStyle.left;
                win.style.width = winObj.prevStyle.width;
                win.style.height = winObj.prevStyle.height;
                winObj.maximized = false;
            }
        }

        function focusWindow(appId) {
            const win = windows[appId];
            if (win) {
                win.element.style.zIndex = ++highestZIndex;
                updateTaskbar(appId, true);
            }
        }

        // --- Dragging Logic ---
        let isDragging = false;
        let dragOffset = { x: 0, y: 0 };
        let currentDragWin = null;

        function startDrag(e, appId) {
            if (e.target.closest('button')) return; // Don't drag if clicking buttons
            if (windows[appId].maximized) return; // Don't drag if maximized

            isDragging = true;
            currentDragWin = windows[appId].element;
            focusWindow(appId);

            const rect = currentDragWin.getBoundingClientRect();
            dragOffset.x = e.clientX - rect.left;
            dragOffset.y = e.clientY - rect.top;

            // Add global listeners
            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', stopDrag);
        }

        function onDrag(e) {
            if (!isDragging || !currentDragWin) return;
            
            // Boundary checks
            let x = e.clientX - dragOffset.x;
            let y = e.clientY - dragOffset.y;
            
            // Basic constraints
            if (y < 0) y = 0;
            
            currentDragWin.style.left = `${x}px`;
            currentDragWin.style.top = `${y}px`;
        }

        function stopDrag() {
            isDragging = false;
            currentDragWin = null;
            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('mouseup', stopDrag);
        }

        // --- Taskbar Logic ---
        function addToTaskbar(appId) {
            const bar = document.getElementById('taskbar-apps');
            const btn = document.createElement('div');
            btn.className = `taskbar-item p-2 rounded mx-1 cursor-pointer active text-white`;
            btn.id = `tb-${appId}`;
            btn.innerHTML = `<i class="${getIconForApp(appId)} text-xl"></i>`;
            btn.onclick = () => {
                const win = windows[appId];
                if (win.element.style.display === 'none') {
                    win.element.style.display = 'flex';
                    focusWindow(appId);
                } else if (parseInt(win.element.style.zIndex) !== highestZIndex) {
                    focusWindow(appId);
                } else {
                    minimizeWindow(appId);
                }
            };
            bar.appendChild(btn);
        }

        function removeFromTaskbar(appId) {
            const btn = document.getElementById(`tb-${appId}`);
            if (btn) btn.remove();
        }

        function updateTaskbar(appId, isActive) {
            const btn = document.getElementById(`tb-${appId}`);
            if (btn) {
                if (isActive) btn.classList.add('active');
                else btn.classList.remove('active');
            }
        }

        function toggleStartMenu() {
            const menu = document.getElementById('start-menu');
            if (menu.classList.contains('closed')) {
                menu.classList.remove('closed');
                menu.classList.remove('hidden');
            } else {
                menu.classList.add('closed');
                setTimeout(() => menu.classList.add('hidden'), 200);
            }
        }

        // Close start menu if clicked outside
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('start-menu');
            const btn = document.querySelector('button[onclick="toggleStartMenu()"]');
            if (!menu.contains(e.target) && !btn.contains(e.target) && !menu.classList.contains('closed')) {
                toggleStartMenu();
            }
        });

        // --- Utils ---
        function getIconForApp(appId) {
            const map = {
                'about': 'fas fa-user',
                'projects': 'fas fa-folder',
                'terminal': 'fas fa-terminal',
                'contact': 'fas fa-envelope',
                'browser': 'fas fa-globe'
            };
            return map[appId] || 'fas fa-window-maximize';
        }

        // --- Clock ---
        function updateClock() {
            const now = new Date();
            const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const date = now.toLocaleDateString();
            document.getElementById('time').innerText = time;
            document.getElementById('date').innerText = date;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- Terminal Simulator ---
        const fileSystem = {
            'about.txt': "Hi! I'm John, a Python Developer passionate about clean code.",
            'projects.py': "def get_projects():\n    return ['Scraper', 'E-Com', 'Chatbot']",
            'contact.info': "Email: john@example.com\nGithub: @johndoe",
            'skills.json': "['Python', 'Django', 'React', 'Linux']"
        };

        function setupTerminal() {
            const input = document.getElementById('term-input');
            const output = document.getElementById('terminal-output');
            
            if (!input) return; // Wait for DOM

            input.onkeydown = function(e) {
                if (e.key === 'Enter') {
                    const cmd = this.value.trim();
                    printLine(`➜ ~ ${cmd}`, 'text-white mb-1');
                    processCommand(cmd, output);
                    this.value = '';
                    // Scroll to bottom
                    output.parentElement.scrollTop = output.parentElement.scrollHeight;
                }
            };
            
            input.focus();
        }

        function printLine(text, className = 'text-gray-300') {
            const output = document.getElementById('terminal-output');
            const div = document.createElement('div');
            div.className = className;
            div.textContent = text;
            output.appendChild(div);
        }

        function processCommand(cmd, output) {
            const args = cmd.split(' ');
            const command = args[0].toLowerCase();

            switch (command) {
                case 'help':
                    printLine('Available commands:');
                    printLine('  ls              List files');
                    printLine('  clear           Clear terminal');
                    printLine('  whoami          Display user');
                    break;
                case 'ls':
                    printLine(Object.keys(fileSystem).join('   '), 'text-blue-400 font-bold');
                    break;
                case 'cat':
                    if (args[1] && fileSystem[args[1]]) {
                        printLine(fileSystem[args[1]]);
                    } else {
                        printLine(`cat: ${args[1] || ''}: No such file`, 'text-red-400');
                    }
                    break;
                case 'python':
                case 'python3':
                    if (args[1] === 'projects.py') {
                        printLine('Running projects.py...');
                        setTimeout(() => {
                            printLine("['Scraper', 'E-Com', 'Chatbot']", 'text-green-400');
                        }, 500);
                    } else if (args[1]) {
                        printLine(`python: can't open file '${args[1]}': [Errno 2] No such file`, 'text-red-400');
                    } else {
                        printLine('Python 3.9.5 Interactive Shell. Type exit() to quit.');
                    }
                    break;
                case 'clear':
                    output.innerHTML = '';
                    break;
                case 'whoami':
                    printLine('root (just kidding, it\'s a portfolio visitor)', 'text-yellow-300');
                    break;
                case 'open':
                    if (['about', 'projects', 'contact', 'browser'].includes(args[1])) {
                        printLine(`Opening ${args[1]}...`);
                        openWindow(args[1]);
                    } else {
                         printLine(`App '${args[1]}' not found.`, 'text-red-400');
                    }
                    break;
                case '':
                    break;
                default:
                    printLine(`command not found: ${command}`, 'text-red-400');
            }
        }

        // --- Google Search Logic ---
        function googleSearch() {
            const query = document.getElementById('google-search-input').value;
            if (query) {
                window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
            }
        }

        // Start
        window.onload = runBootSequence;

    </script>
